name: AuroraPlayer
options:
  bundleIdPrefix: com.aurora
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4
  tabWidth: 4
  deploymentTarget:
    iOS: 16.0

targets:
  AuroraPlayer:
    type: application
    platform: iOS
    sources:
      - AuroraPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.player
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: TU_TEAM_ID_AQUI
        TARGETED_DEVICE_FAMILY: 1,2
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: LaunchScreen
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchStoryboardName: LaunchScreen