name: AuroraPlayer
options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: 16.0

targets:
  AuroraPlayer:
    type: application
    platform: iOS
    sources:
      - path: AuroraPlayer
        excludes:
          - "Info.plist"
      - path: AuroraPlayerApp.swift
      - path: Assets.xcassets   # ✅ Así, sin guión extra
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.player
        INFOPLIST_FILE: AuroraPlayer/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: 16.0