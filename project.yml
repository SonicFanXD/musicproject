name: AuroraPlayer
options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: 16.0
  usesTabs: false
  indentWidth: 4

targets:
  AuroraPlayer:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - path: AuroraPlayer
        excludes:
          - "**/*.plist"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Aurora Player
        CFBundleName: AuroraPlayer
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1.0"
        CFBundleShortVersionString: "1.0"
        UIBackgroundModes:
          - audio
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - armv7
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.auroraplayer
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - framework: AVFoundation.framework
      - framework: MediaPlayer.framework
      - framework: UIKit.framework
      - framework: SwiftUI.framework