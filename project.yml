name: AuroraPlayer
options:
  bundleIdPrefix: com.aurora
targets:
  AuroraPlayer:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - AuroraPlayer
    settings:
      INFOPLIST_FILE: Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.aurora.player
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: TU_TEAM_ID
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchStoryboardName: LaunchScreen