name: AuroraPlayer
options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: 16.0
targets:
  AuroraPlayer:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - AuroraPlayerApp.swift
      - AuroraPlayer/Resources/Models.swift
      - AuroraPlayer/Services/AudioEngine.swift
      - AuroraPlayer/Services/FileAccessService.swift
      - AuroraPlayer/Views/ContentView.swift
      - AuroraPlayer/Views/FolderPickerView.swift
      - AuroraPlayer/Views/PlayerBar.swift
    info:
      path: Info.plist
      properties:
        UIBackgroundModes:
          - audio
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.auroraplayer
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""  # Deja vacío o pon tu Team ID si lo tienes