name: AuroraPlayer
options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: 16.0

# ✅ MIGRACIÓN SFB: SFBAudioEngine (decodificación + gapless nativo).
# El paquete tira de ~20 dependencias (XCFrameworks binarios: FLAC, Opus,
# Vorbis, mpg123, LAME…) — la primera resolución/compilación en CI es lenta;
# fijar versión con `from:` para builds deterministas.
packages:
  SFBAudioEngine:
    url: https://github.com/sbooth/SFBAudioEngine
    from: 0.14.0

targets:
  AuroraPlayer:
    type: application
    platform: iOS
    dependencies:
      - package: SFBAudioEngine
    sources:
      # ✅ Fonts se excluye del árbol general y se añade aparte como recurso:
      # así XcodeGen copia los .ttf a la raíz del bundle y `UIAppFonts`
      # (Roboto-Regular.ttf, etc.) los encuentra sin depender de un folder
      # reference que iOS no registra.
      - path: AuroraPlayer
        excludes:
          - Resources/Fonts
      - path: AuroraPlayerApp.swift
      - path: Assets.xcassets   # ✅ Así, sin guión extra
      # ✅ Roboto (Resources/Fonts): explícito como recurso para que XcodeGen
      # copie SIEMPRE los .ttf a la raíz del bundle (un .ttf incluido a través
      # del árbol `AuroraPlayer` podía quedarse fuera y la app caía al sistema).
      - path: AuroraPlayer/Resources/Fonts
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.player
        INFOPLIST_FILE: AuroraPlayer/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
