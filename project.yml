name: AuroraPlayer
options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: 16.0
  xcodeVersion: "15.0"
settings:
  BASE:
    PRODUCT_BUNDLE_IDENTIFIER: com.aurora.player
    CURRENT_PROJECT_VERSION: 1.0.0
    MARKETING_VERSION: 1.0.0
  configs:
    Debug:
      PRODUCT_BUNDLE_IDENTIFIER: com.aurora.player.debug
    Release:
      PRODUCT_BUNDLE_IDENTIFIER: com.aurora.player

targets:
  AuroraPlayer:
    type: application
    platform: iOS
    deploymentTarget: 16.0
    sources:
      - AuroraPlayer
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "" # Lo dejarás vacío para que lo pongas tú
        PROVISIONING_PROFILE_SPECIFIER: ""
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_BITCODE: NO
    info:
      path: Info.plist
      properties:
        UIBackgroundModes:
          - audio
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: "Aurora Player necesita acceder a tus archivos de música."