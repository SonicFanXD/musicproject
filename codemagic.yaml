workflows:
  build-unsigned-ipa:
    name: Build AuroraPlayer (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 30

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.aurora.player
        XCODE_PROJECT: "AuroraPlayer.xcodeproj"
        SCHEME: "AuroraPlayer"
        CONFIGURATION: "Release"
        DERIVED_DATA: "./DerivedData"

    scripts:
      - name: Generate Xcode project (XcodeGen)
        script: |
          brew install xcodegen
          xcodegen generate
          echo "📋 Archivos generados:"
          ls -la "$XCODE_PROJECT"

      - name: Verify project structure
        script: |
          echo "🔍 Verificando Info.plist..."
          if [ ! -f "AuroraPlayer/Info.plist" ]; then
            echo "❌ Info.plist NO encontrado"
            exit 1
          fi
          echo "✅ Info.plist encontrado"
          echo "📋 Contenido del proyecto:"
          ls -la AuroraPlayer/

      - name: Build for iOS Device (no code signing)
        script: |
          set -o pipefail
          echo "🔨 Iniciando build..."
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee /tmp/build.log | xcpretty
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ Build falló con código $EXIT_CODE"
            echo "🔍 Errores de compilación:"
            grep -E "(error:|warning:)" /tmp/build.log | head -30
            exit $EXIT_CODE
          fi
          echo "✅ Build exitoso"

      - name: Create unsigned .ipa
        script: |
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/$SCHEME.app"
          echo "📁 Buscando .app en: $APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ No se encontró el .app"
            echo "🔍 Buscando .app en DerivedData..."
            find "$DERIVED_DATA" -name "*.app" 2>/dev/null
            echo "📋 Contenido de DerivedData:"
            ls -la "$DERIVED_DATA/Build/Products/" 2>/dev/null || true
            exit 1
          fi
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "❌ El .app no contiene Info.plist"
            echo "📋 Contenido del .app:"
            ls -la "$APP_PATH"
            exit 1
          fi
          echo "✅ .app válido encontrado"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AuroraPlayer_unsigned.ipa Payload
          rm -rf Payload
          echo "✅ IPA creado: AuroraPlayer_unsigned.ipa ($(du -h AuroraPlayer_unsigned.ipa | cut -f1))"

    artifacts:
      - AuroraPlayer_unsigned.ipa

    publishing:
      email:
        recipients:
          - rcortez.fsv@icloud.com
        notify:
          success: true
          failure: true