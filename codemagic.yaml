workflows:
  build-unsigned-ipa:
    name: Build AuroraPlayer (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 30

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.aurora.player
        XCODE_PROJECT: "AuroraPlayer.xcodeproj"
        SCHEME: "AuroraPlayer"
        CONFIGURATION: "Release"
        DERIVED_DATA: "./DerivedData"   # Ruta fija para DerivedData

    scripts:
      - name: Generate Xcode project (XcodeGen)
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iOS Device (no code signing)
        script: |
          xcodebuild clean build \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | xcpretty

      - name: Create unsigned .ipa
        script: |
          # Ruta exacta del .app generado (por el -derivedDataPath)
          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/$SCHEME.app"
          echo "📁 Buscando .app en: $APP_PATH"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ No se encontró el .app en la ruta esperada."
            echo "🔍 Buscando en DerivedData..."
            find "$DERIVED_DATA" -name "*.app" -path "*/Release-iphoneos/*"
            exit 1
          fi
          # Verificar que Info.plist existe
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "❌ El .app no contiene Info.plist. Posible build fallido."
            ls -la "$APP_PATH"
            exit 1
          fi
          echo "✅ .app válido encontrado. Empaquetando..."
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AuroraPlayer_unsigned.ipa Payload
          rm -rf Payload
          echo "✅ IPA creado: AuroraPlayer_unsigned.ipa ($(du -h AuroraPlayer_unsigned.ipa | cut -f1))"

    artifacts:
      - AuroraPlayer_unsigned.ipa

    publishing:
      email:
        recipients:
          - rcortez.fsv@icloud.com   # Reemplaza con tu correo real
        notify:
          success: true
          failure: true