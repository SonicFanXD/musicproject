name: Build Signed IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -s '/Applications/Xcode.app/Contents/Developer'

      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and sign app
        run: |
          xcodebuild clean build \
            -project "AuroraPlayer.xcodeproj" \
            -scheme "AuroraPlayer" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Create signed .ipa
        run: |
          mkdir -p Payload
          cp -R "$(find ~/Library/Developer/Xcode/DerivedData -name '*.app' | grep -E 'Release-iphoneos/.*\.app$' | head -1)" Payload/
          zip -r AuroraPlayer.ipa Payload/

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: AuroraPlayer
          path: AuroraPlayer.ipa
