name: Build iOS App (No Sign)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: sudo xcode-select -s '/Applications/Xcode.app/Contents/Developer'

    - name: Generate Xcode project (si usas XcodeGen)
      run: |
        brew install xcodegen
        xcodegen generate

    - name: Build for iOS Device (no code signing)
      run: |
        xcodebuild clean build \
          -project "AuroraPlayer.xcodeproj" \
          -scheme "AuroraPlayer" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ONLY_ACTIVE_ARCH=NO

    - name: Create .ipa from .app
      run: |
        mkdir -p Payload
        cp -R "$(find ~/Library/Developer/Xcode/DerivedData -name '*.app' | grep -E 'Release-iphoneos/.*\.app$' | head -1)" Payload/
        zip -r AuroraPlayer.ipa Payload/
        mv AuroraPlayer.ipa AuroraPlayer_unsigned.ipa

    - name: Upload unsigned IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuroraPlayer_unsigned
        path: AuroraPlayer_unsigned.ipa
