name: Build with XcodeGen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and archive
        run: |
          xcodebuild -project AuroraPlayer.xcodeproj -scheme AuroraPlayer -configuration Release -archivePath build/AuroraPlayer.xcarchive archive
          xcodebuild -exportArchive -archivePath build/AuroraPlayer.xcarchive -exportPath build -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AuroraPlayer.ipa
          path: build/AuroraPlayer.ipa
