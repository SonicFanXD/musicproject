name: AuroraPlayer
options:
  bundleIdPrefix: com.aurora
  deploymentTarget:
    iOS: 16.0
  developmentTeam: ${APPLE_TEAM_ID}
  signingStyle: automatic
targets:
  AuroraPlayer:
    type: application
    platform: iOS
    sources:
      - AuroraPlayer
    info:
      path: AuroraPlayer/Info.plist
      properties:
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aurora.auroraplayer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.0
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
    dependencies: []
