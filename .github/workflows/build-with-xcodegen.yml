name: Build iOS App (Firmado)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: sudo xcode-select -s '/Applications/Xcode.app/Contents/Developer'

    - name: Install XcodeGen (si usas project.yml)
      run: |
        brew install xcodegen
        xcodegen generate

    - name: Build for iOS Device (CON FIRMA)
      run: |
        xcodebuild clean build \
          -project "AuroraPlayer.xcodeproj" \
          -scheme "AuroraPlayer" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          CODE_SIGN_STYLE=Automatic \
          DEVELOPMENT_TEAM=TU_TEAM_ID_AQUI \
          PROVISIONING_PROFILE_SPECIFIER="" \
          ONLY_ACTIVE_ARCH=NO

    - name: Create .ipa from .app
      run: |
        mkdir -p Payload
        cp -R "$(find ~/Library/Developer/Xcode/DerivedData -name '*.app' | grep -E 'Release-iphoneos/.*\.app$' | head -1)" Payload/
        zip -r AuroraPlayer.ipa Payload/

    - name: Upload signed IPA as artifact
      uses: actions/upload-artifact@v4
      with:
        name: AuroraPlayer
        path: AuroraPlayer.ipa
