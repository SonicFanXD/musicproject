name: iOS Build (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s '/Applications/Xcode.app/Contents/Developer'

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "--- Verificando proyecto generado ---"
          ls -la *.xcodeproj 2>/dev/null || echo "⚠️ No se encontró .xcodeproj en raíz"
          find . -maxdepth 2 -name "*.xcodeproj" -type d 2>/dev/null

      - name: Build for iOS Device (no code signing)
        run: |
          # Encontrar el proyecto generado (puede estar en raíz o subdirectorio)
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" -type d | head -n 1 | sed 's|^\./||')
          if [ -z "$PROJECT" ]; then
            echo "❌ No se encontró ningún .xcodeproj"
            exit 1
          fi
          echo "📦 Proyecto encontrado: $PROJECT"
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme AuroraPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          # Mostrar solo lo relevante en el summary
          grep -E "error:" build.log | head -30 >> $GITHUB_STEP_SUMMARY || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            echo "❌ Build falló" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ BUILD SUCCEEDED" >> $GITHUB_STEP_SUMMARY

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find ./build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "⚠️ No se encontró el .app"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r AuroraPlayer-unsigned.ipa Payload
          echo "✅ IPA creada: $(du -h AuroraPlayer-unsigned.ipa | cut -f1)"

      - name: Upload build log (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraPlayer-unsigned
          path: AuroraPlayer-unsigned.ipa