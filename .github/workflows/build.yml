name: iOS Build (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Device (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project AuroraPlayer.xcodeproj \
            -scheme AuroraPlayer \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          # Mostrar solo lo relevante en el summary
          grep -E "error:" build.log | head -30 >> $GITHUB_STEP_SUMMARY || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            echo "❌ Build falló" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "✅ BUILD SUCCEEDED" >> $GITHUB_STEP_SUMMARY

      - name: Package unsigned .ipa
        run: |
          APP_PATH=$(find ./build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "⚠️ No se encontró el .app"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r AuroraPlayer-unsigned.ipa Payload
          echo "✅ IPA creada: $(du -h AuroraPlayer-unsigned.ipa | cut -f1)"

      - name: Upload build log (si falló)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuroraPlayer-unsigned
          path: AuroraPlayer-unsigned.ipa